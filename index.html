.pp-two button:active{transform:scale(.95)}
.pp-seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.pp-seg3 button{height:42px;border-radius:21px;background:color-mix(in srgb,var(--ink) 9%,transparent);font-size:14px;font-weight:800;transition:background-color .2s,color .2s,transform .25s cubic-bezier(.34,1.56,.64,1)}
.pp-seg3 button:active{transform:scale(.95)}
.pp-seg3 button[aria-pressed="true"]{background:var(--c);color:var(--t)}
.pp-big{font-size:48px;font-weight:800;text-align:center;letter-spacing:-.04em;line-height:1.1;margin:6px 0 0;font-variant-numeric:tabular-nums}
.pp-rng{width:100%;margin:8px 0 2px;height:36px;accent-color:var(--ink)}
.pp-prev{display:grid;gap:3px;font-size:13.5px;font-weight:700;margin:4px 2px 2px}
.pp-prev div{display:flex;justify-content:space-between;gap:8px}
.pp-prev .more{opacity:.7}
.pp-sw{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;margin-top:4px}
.pp-sw button{height:46px;display:grid;place-items:center;animation:kin .4s cubic-bezier(.16,1,.3,1) backwards;animation-delay:calc(var(--i)*22ms + 80ms)}
.pp-sw i{width:28px;height:28px;border-radius:50%;background:var(--c);transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .2s}
.pp-sw button:active i{transform:scale(.85)}

  <div class="toast" id="toast" role="status"><span id="toastTxt"></span><button type="button" id="toastBtn" hidden>Deshacer</button></div>
</main>

<script>
(function(){
  /* sin selección de texto: se anula también por código, salvo dentro de los campos de texto */
  (function(){

  function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

    {id:3,n:'Gel',p:1200,c:350,k:'b',s:3,f:1},
    {id:4,n:'Diseño por uña',p:80,c:15,k:'n',s:4,f:1},
    {id:5,n:'Piedra por uña',p:40,c:10,k:'n',s:5,f:1},

  function num(v){return typeof v==='number'&&isFinite(v)}

        .map(function(x,i){return {id:x.id,n:x.n.trim().slice(0,28),p:Math.round(x.p*100)/100,c:num(x.c)&&x.c>=0?Math.round(x.c*100)/100:0,k:x.k,s:(x.s>=1&&x.s<=12)?Math.round(x.s):(i%12)+1,f:x.f?1:0}});

    }
    var j=o.job&&typeof o.job==='object'?o.job:{},ids={};d.svc.forEach(function(x){ids[x.id]=x});

    Object.keys(j.n||{}).forEach(function(k){var n=+j.n[k];if(ids[k]&&ids[k].k==='n'&&n>=1&&n<=10)d.job.n[k]=Math.round(n)});
    Object.keys(j.e||{}).forEach(function(k){if(ids[k]&&ids[k].k==='e'&&j.e[k])d.job.e[k]=1});
    Object.keys(o.last||{}).forEach(function(k){var n=+o.last[k];if(ids[k]&&n>=1&&n<=10)d.last[k]=Math.round(n)});
    d.recent=(Array.isArray(o.recent)?o.recent:[]).filter(function(r){return r&&num(r.t)&&num(r.total)&&Array.isArray(r.lines)}).slice(0,20)
      .map(function(r){return {t:r.t,total:r.total,lines:r.lines.filter(function(l){return l&&typeof l.n==='string'&&num(l.p)}).map(function(l){return {id:num(l.id)?l.id:0,n:l.n.slice(0,28),q:num(l.q)?l.q:0,p:l.p}})}});
    var sig=function(a){return JSON.stringify(a.map(function(x){return [x.id,x.n,x.p,x.c,x.k]}))};
    d.seed=o.seed!==false&&sig(d.svc)===sig(SEED);
    if(typeof o.msg==='string')d.msg=o.msg.replace(/[<>]/g,'').slice(0,48);
    return d;
  }
  function load(){try{var r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
  var D=clean(load())||fresh();
  var BY={};function index(){BY={};D.svc.forEach(function(x){BY[x.id]=x})}index();
  var shown=0;

  /* ================= PRIMERA PANTALLA: mosaico + abanico + fondo que se entrelaza ================= */
  var DARKMQ=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):{matches:false};
  /* colores de fondo vivos, uno por servicio (claro y oscuro) */
  var GROUND={1:'#5B7CFF',2:'#14CDBF',3:'#D35CF4',4:'#FF5C47',5:'#FFB300',6:'#4FD233',7:'#FF4FA3',8:'#9570FF',9:'#E6A55C',10:'#FF8420',11:'#1FCB83',12:'#5F9DDB'};
  /* oscuro o claro: manda el sistema del teléfono (y el modo que fije el visor, si lo hay); la app no tiene selector propio */
  function isDark(){var th=document.documentElement.getAttribute('data-theme');return th==='dark'||(th!=='light'&&!!DARKMQ.matches)}
  var GROUND_D={1:'#2E43B8',2:'#0A7F7C',3:'#8E36A8',4:'#C4382A',5:'#8F6606',6:'#2F7D17',7:'#B52A74',8:'#5B43C4',9:'#7A5A3E',10:'#B5560F',11:'#137A4B',12:'#526A82'};
  function shortName(n){return n.replace(/ por uña$/i,'')}
  var lastTap=null;
  /* de dónde nace la ola de color: el último toque */
  document.addEventListener('pointerdown',function(e){lastTap={x:e.clientX,y:e.clientY}},true);
  function count(x){return x.k==='n'?(D.job.n[x.id]||0):x.k==='b'?(D.job.b===x.id?1:0):(D.job.e[x.id]?1:0)}
  function calc(){

      var n=count(x);if(!n)return;

    });
    return {t:Math.round(t*100)/100,g:Math.round((t-c)*100)/100,lines:lines};
  }
  function tween(el,from,to,ms){

    (function step(t){var p=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-p,4),v=from+(to-from)*e;el.textContent=money(whole?Math.round(v):v);if(p<1)el.__r=requestAnimationFrame(step)})(t0);
  }
  function lineTxt(l){return l.q?l.n.replace(/ por uña$/i,'')+' ×'+l.q:l.n}
  function summary(r){
    if(!r.lines.length)return D.seed?'Precios de ejemplo. Toca un servicio para empezar.':'Toca un servicio para empezar.';
    return r.lines.map(lineTxt).join(' · ');
  }
  /* ---------- fondo marmoleado (WebGL a media resolución) ---------- */
  var GX={ready:false,S0:null,cur:null,waves:[],uT:0,burst:0,last:0,raf:0};
  var PINK_L=['#FF5FA6','#FF8CC0','#E8478F'],PINK_D=['#7C2D5E','#9B3C78','#5C1F47'];
  function hex(h){return [parseInt(h.substr(1,2),16)/255,parseInt(h.substr(3,2),16)/255,parseInt(h.substr(5,2),16)/255]}
  function mixc(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]}
  /* cada servicio elegido aporta su color con un ancho según lo que pesa; nunca se mezclan en uno solo */
  function stateFrom(L){
    var dk=isDark(),map=dk?GROUND_D:GROUND,it=[];

  }
  var FS=(function(){
    function pal(k){return 'vec3 pal'+k+'(float s){float acc=0.0,e=0.035;vec3 col=vec3(0.0);float ws=0.0;for(int i=0;i<8;i++){if(i>=uN'+k+')break;float a0=acc;float a1=acc+uW'+k+'[i];acc=a1;if(i==0)a0=-1.0;if(i==uN'+k+'-1)a1=2.0;float m=smoothstep(a0-e,a0+e,s)*(1.0-smoothstep(a1-e,a1+e,s));col+=uC'+k+'[i]*m;ws+=m;}return col/max(ws,0.001);}'}
    function un(k){return 'uniform vec3 uC'+k+'[8];uniform float uW'+k+'[8];uniform int uN'+k+';'}
    return '#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\n'+
    'uniform vec2 uRes;uniform float uT;uniform vec2 uP1;uniform vec2 uP2;uniform float uR1;uniform float uR2;'+un(0)+un(1)+un(2)+
    'float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}'+
    'float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(h21(i),h21(i+vec2(1.0,0.0)),f.x),mix(h21(i+vec2(0.0,1.0)),h21(i+vec2(1.0,1.0)),f.x),f.y);}'+
    'float fbm(vec2 p){float a=0.5,s=0.0;for(int i=0;i<4;i++){s+=a*vn(p);p=p*2.03+vec2(7.1,3.7);a*=0.5;}return s;}'+
    pal(0)+pal(1)+pal(2)+
    'float pattern(vec2 uv){float asp=uRes.x/uRes.y;vec2 p=vec2(uv.x*asp,uv.y);float tt=uT;vec2 q=p*1.5;vec2 a=vec2(fbm(q+vec2(0.0,tt*0.10)),fbm(q+vec2(5.2,1.3)-tt*0.08));vec2 b=vec2(fbm(q+3.2*a+vec2(1.7,9.2)+tt*0.12),fbm(q+3.2*a+vec2(8.3,2.8)-tt*0.10));float f=fbm(q+3.6*b);f=f+(p.x*0.35+p.y*0.45-0.35)*0.5;return smoothstep(0.12,0.88,f);}'+
    'vec2 wave(vec2 uv,vec2 tap,float r){float asp=uRes.x/uRes.y;vec2 d=vec2((uv.x-tap.x)*asp,uv.y-tap.y);float dist=length(d)+(fbm(vec2(uv.x*asp,uv.y)*3.0+tap*5.0)-0.5)*0.26;float m=1.0-smoothstep(r-0.18,r,dist);float ring=smoothstep(r-0.24,r-0.12,dist)*(1.0-smoothstep(r-0.07,r,dist));return vec2(m,ring);}'+
    'void main(){float asp=uRes.x/uRes.y;vec2 uv=gl_FragCoord.xy/uRes;float s=pattern(uv);vec3 col=pal0(s);'+
     'if(uR1>=0.0){vec2 w=wave(uv,uP1,uR1);col=mix(col,pal1(s),w.x)+w.y*0.10;}'+
     'if(uR2>=0.0){vec2 w=wave(uv,uP2,uR2);col=mix(col,pal2(s),w.x)+w.y*0.10;}'+
     'float sh=fbm(vec2(uv.x*asp,uv.y)*2.2+3.1+uT*0.03);col*=0.93+0.14*sh;gl_FragColor=vec4(col,1.0);}';
  })();
  function gxInit(){
    var cv=$('gl');
